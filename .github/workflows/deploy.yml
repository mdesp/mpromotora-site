name: Deploy M Promotora Site

on:
  push:
  workflow_dispatch:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy na VPS (build local, sem Docker Hub)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 120s
          script: |
            cd /opt/mpromotora-site
            git pull origin main
            docker build -t mdesp/mpromotora-site:latest .
            docker stack deploy -c /root/docker-compose-mpromotora.yml mpromotora
            echo "Deploy concluido — $(date)"
